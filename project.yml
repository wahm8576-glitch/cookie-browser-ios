name: WahmCookieBrowser
options:
  bundleIdPrefix: com.wahm
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  defaultConfig: Release
  groupSortPosition: top
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.wahm.cookiebrowser
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: WahmCookieBrowser/Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: "متصفح وهم"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDevelopmentRegion: ar
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    SUPPORTS_MACCATALYST: "NO"
    ENABLE_BITCODE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_EMIT_LOC_STRINGS: "YES"
targets:
  WahmCookieBrowser:
    type: application
    platform: iOS
    sources:
      - path: WahmCookieBrowser
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: WahmCookieBrowser
        PRODUCT_BUNDLE_IDENTIFIER: com.wahm.cookiebrowser
schemes:
  WahmCookieBrowser:
    build:
      targets:
        WahmCookieBrowser: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
